<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pogoda</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="start">
        <header class="start__header">
            <h1 class="start__title">Pogoda</h1>
            <p class="start__lead">Sprawdź prognozę dla dowolnego miejsca.</p>
        </header>

        <nav class="tiles" aria-label="Menu główne">
            <a class="tile" href="/wyszukaj">
                <svg class="tile__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="6.5"/>
                    <path d="M20 20l-4.2-4.2"/>
                </svg>
                <span class="tile__text">
                    <span class="tile__name">Wyszukaj</span>
                    <span class="tile__desc">Znajdź miejscowość i sprawdź pogodę.</span>
                </span>
                <svg class="tile__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M7 17L17 7M9 7h8v8"/>
                </svg>
            </a>

            <a class="tile" href="/wyniki">
                <svg class="tile__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M5 20V11M12 20V4M19 20v-6"/>
                </svg>
                <span class="tile__text">
                    <span class="tile__name">Wyniki</span>
                    <span class="tile__desc">Zobacz ostatnio sprawdzane prognozy.</span>
                </span>
                <svg class="tile__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M7 17L17 7M9 7h8v8"/>
                </svg>
            </a>
        </nav>
    </main>
</body>
</html>
